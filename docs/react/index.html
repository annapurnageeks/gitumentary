<html lang="en">
<head>
<meta charset="utf-8">

<title>a gitumentary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080b;
    --ink: #f3efe6;
    --dim: #9b9a93;
    --faint: #4c4e55;
    --line: #1c1e25;
    --accent: #f5b544;
    --twist: #ff6b4a;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --gutter: clamp(16px, 3vw, 32px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  #app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto auto; }

  header { padding: 18px var(--gutter) 6px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: baseline; }
  .brand { font: 500 11px/1.2 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand b { color: var(--ink); font-weight: 600; letter-spacing: .08em; text-transform: none; font-size: 13px; }
  .date { font: 400 clamp(24px, 3.4vw, 38px)/1 var(--serif); text-align: right; font-variant-numeric: tabular-nums; }
  .chapter-label { font: 400 clamp(17px, 2vw, 22px)/1.2 var(--serif); font-style: italic; color: var(--ink); min-height: 1.2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chapter-label span { font: 500 10.5px/1 var(--sans); font-style: normal; letter-spacing: .24em; text-transform: uppercase; color: var(--accent); margin-right: 10px; vertical-align: 3px; }
  .stats { display: flex; gap: clamp(12px, 2.4vw, 28px); justify-content: flex-end; font: 400 12px/1 var(--mono); color: var(--dim); white-space: nowrap; }
  .stats b { color: var(--ink); font-weight: 500; font-size: 14px; margin-right: 6px; font-variant-numeric: tabular-nums; }

  #stage { position: relative; min-height: 0; margin: 8px var(--gutter) 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; padding: 10px var(--gutter) 0; font: 400 11px/1 var(--sans); color: var(--dim); min-height: 21px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }

  .caption { padding: 12px var(--gutter) 4px; min-height: calc(3 * 1.3em + 16px); display: flex; align-items: center; justify-content: center; text-align: center;
             font: 400 clamp(18px, 2.3vw, 28px)/1.3 var(--serif); text-wrap: balance; }
  .caption p { max-width: 980px; }

  footer { padding: 6px var(--gutter) 14px; }
  .ticker { font: 400 11.5px/1.4 var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 1.4em; margin-bottom: 8px; }
  .ticker em { font-style: normal; color: var(--dim); }
  .controls { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 14px; align-items: center; transition: opacity .3s; }
  .controls button { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--dim); }
  .controls button:hover { color: var(--ink); background: #ffffff0d; }
  .controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #speed { font: 500 12px/1 var(--mono); width: 40px; }
  .time { font: 400 12px/1 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { position: relative; height: 22px; cursor: pointer; touch-action: none; }
  .segs { position: absolute; left: 0; right: 0; top: 9px; height: 4px; display: flex; gap: 3px; }
  .segs div { height: 100%; background: var(--line); border-radius: 2px; }
  .fill { position: absolute; left: 0; top: 9px; height: 4px; background: var(--ink); border-radius: 2px; pointer-events: none; mix-blend-mode: difference; }
  .head { position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--ink); pointer-events: none; box-shadow: 0 0 0 4px #07080b; }
  body.clean .controls, body.clean .ticker { opacity: 0; }
  body.clean .controls:hover { opacity: 1; }

  .card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: var(--gutter);
          background: radial-gradient(ellipse at center, #0d0e13f2 0%, #07080bfa 70%); opacity: 0; pointer-events: none; }
  .kicker { font: 500 11px/1 var(--sans); letter-spacing: .34em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
  .card h1 { font: 400 clamp(44px, 8vw, 104px)/1 var(--serif); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .card h2 { font: 400 clamp(36px, 6vw, 76px)/1.05 var(--serif); letter-spacing: -.01em; max-width: 14em; }
  .card .sub { margin-top: 18px; font: italic 400 clamp(18px, 2.4vw, 26px)/1.3 var(--serif); color: var(--dim); }
  .card .meta { margin-top: 26px; font: 400 12px/1 var(--mono); color: var(--dim); letter-spacing: .06em; }

  .toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); padding: 12px 20px 13px; border-radius: 999px; background: #0b0c10e8;
           border: 1px solid #ffffff1a; backdrop-filter: blur(6px); white-space: nowrap; opacity: 0; pointer-events: none; max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; }
  .toast b { font: 600 10.5px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--twist); margin-right: 12px; vertical-align: 2px; }
  .toast span { font: 400 clamp(17px, 2vw, 22px)/1 var(--serif); }

  #credits { justify-content: flex-start; overflow: hidden; background: #07080bfa; }
  .roll { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; will-change: transform; }
  .roll .kicker { margin: 0 0 18px; }
  .roll .row { display: flex; gap: 18px; justify-content: center; align-items: baseline; font: 400 clamp(18px, 2.2vw, 24px)/1.2 var(--serif); }
  .roll .row span { font: 400 11px/1 var(--mono); color: var(--faint); min-width: 7em; text-align: left; }
  .roll .row strong { font-weight: 400; min-width: 9em; text-align: right; }
  .roll .gap { height: 40px; }
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; padding: var(--gutter); }
  #end .made { margin-top: 34px; font: 400 13px/1.6 var(--sans); color: var(--dim); }
  #end .made a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--faint); }
  #end .made a:hover { border-color: var(--accent); }
  #replay { margin-top: 22px; padding: 10px 20px; border: 1px solid #ffffff24; border-radius: 999px; font: 500 13px/1 var(--sans); color: var(--ink); }
  #replay:hover { background: #ffffff10; }

  @media (max-width: 640px) {
    header { grid-template-columns: 1fr; }
    .date { text-align: left; grid-row: 2; }
    .stats { justify-content: flex-start; }
    .stats b { font-size: 12.5px; }
    .controls { grid-template-columns: auto 1fr auto auto; gap: 8px; }
    .time { display: none; }
    .roll .row strong, .roll .row span { min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .controls { transition: none; } }
</style>
</head>

</div>

</section>

    <div class="made">Made with <a id="made" target="_blank" rel="noopener">gitumentary</a>. Make one for your repo.</div>
    <button id="replay">↺ Watch again</button>
  </div>
</section>

<script>
"use strict";
const S = JSON.parse(document.getElementById("story").textContent);
const $ = (id) => document.getElementById(id);

// ---------- small helpers ----------
const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
const smooth = (x) => x * x * (3 - 2 * x);
const fadeInOut = (u, dur, fadeIn = 0.6, fadeOut = 0.6) => clamp(Math.min(u / fadeIn, (dur - u) / fadeOut));
const full = (n) => Math.round(n).toLocaleString("en-US");
const short = (n) => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(Math.round(n));
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const monthYear = (ts) => { const d = new Date(ts * 1000); return MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear(); };
const year = (ts) => new Date(ts * 1000).getUTCFullYear();
const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
const clock = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const yearsOf = (a, b) => year(a) === year(b) ? String(year(a)) : year(a) + " — " + year(b);
const plural = (n, word) => full(n) + " " + word + (n === 1 ? "" : "s");
const hexToRgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
function setText(el, text) { if (el.textContent !== text) el.textContent = text; }
function setOpacity(el, v) { const s = v.toFixed(3); if (el.style.opacity !== s) el.style.opacity = s; }
function splitSentences(text) {
  return text.split(/(?<=[.!?…]["”’)]?)\s+(?=["“‘(]?[A-Z0-9])/).map((s) => s.trim()).filter(Boolean);
}

// ---------- the timeline: intro, one segment per chapter, credits ----------
const CARD = 2.8;      // seconds a chapter's title card stays up
const TOAST = 3.6;     // seconds a plot-twist card stays up
const segments = [];
let cursor = 0;
const addSegment = (kind, dur, extra = {}) => { segments.push({ kind, dur, start: cursor, ...extra }); cursor += dur; };
addSegment("intro", 4.6);
S.chapters.forEach((ch, i) => {
  ch.sentences = splitSentences(ch.narration);
  ch.words = ch.sentences.map((s) => s.split(/\s+/).length + 3);
  ch.active = ch.frames.map((f) => new Map(f.x));
  const words = ch.narration.split(/\s+/).length;
  addSegment("chapter", clamp(CARD + 1.6 + words / 3.1, 10, 23), { i });
});
addSegment("credits", clamp(8 + S.cast.length * 0.3, 10, 20));
const TOTAL = cursor;
const segmentAt = (t) => { for (let i = segments.length - 1; i >= 0; i--) if (t >= segments[i].start) return segments[i]; return segments[0]; };
// Within a chapter, the codebase grows while the narration plays, starting as the title card fades.
const growStart = CARD * 0.55;
const growth = (seg, u) => clamp((u - growStart) / (seg.dur - growStart - 1.2));
const eventTime = (seg, at) => growStart + at * (seg.dur - growStart - 1.2);

// ---------- static text ----------
document.title = S.title + " — a gitumentary";
setText($("repo"), S.repo);
setText($("intro-title"), S.title);
setText($("intro-sub"), S.tagline);
setText($("intro-meta"), yearsOf(S.first_time, S.last_time) + "  ·  " + plural(S.totals.commits, "commit") + "  ·  " + plural(S.totals.people, "contributor"));
setText($("end-title"), S.title);
setText($("end-sub"), yearsOf(S.first_time, S.last_time) + " · " + full(S.totals.commits) + " commits · " + short(S.totals.lines) + " lines");
$("made").href = S.project_url;
(function buildCredits() {
  const roll = $("roll");
  const add = (cls, html) => { const d = document.createElement("div"); d.className = cls; if (html) d.textContent = html; roll.appendChild(d); return d; };
  add("gap"); add("kicker", "Starring");
  for (const p of S.cast) {
    const row = add("row");
    const name = document.createElement("strong"); name.textContent = p.name;
    const info = document.createElement("span"); info.textContent = plural(p.commits, "commit") + " · " + p.since;
    row.append(name, info);
  }
  if (S.totals.people > S.cast.length) add("row").textContent = "and " + full(S.totals.people - S.cast.length) + " more";
  add("gap");
})();
(function buildTrack() {
  const segs = $("segs");
  for (const s of segments) {
    const d = document.createElement("div");
    d.style.flex = String(s.dur);
    d.title = s.kind === "chapter" ? "Chapter " + ROMAN[s.i] + ": " + S.chapters[s.i].title : s.kind;
    if (s.kind !== "chapter") d.style.opacity = "0.5";
    segs.appendChild(d);
  }
})();

// ---------- the canvas: a treemap of the codebase's areas ----------
const canvas = $("canvas"), ctx = canvas.getContext("2d");
const RGB = S.areas.map((a) => hexToRgb(a.color));
let W = 0, H = 0;
function resize() {
  const r = canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(() => { resize(); draw(t); }).observe(canvas);

// Squarified treemap (Bruls, Huizing & van Wijk). Items keep a fixed order so boxes don't jump around.
function squarify(items, x, y, w, h) {
  const out = [];
  let row = [];
  const worst = (r, side) => { let sum = 0, max = 0, min = Infinity; for (const it of r) { sum += it.v; max = Math.max(max, it.v); min = Math.min(min, it.v); } return Math.max((side * side * max) / (sum * sum), (sum * sum) / (side * side * min)); };
  const layRow = () => {
    const sum = row.reduce((a, it) => a + it.v, 0);
    if (w >= h) { const cw = sum / h; let cy = y; for (const it of row) { const rh = it.v / cw; out.push({ ...it, x, y: cy, w: cw, h: rh }); cy += rh; } x += cw; w -= cw; }
    else { const rh = sum / w; let cx = x; for (const it of row) { const rw = it.v / rh; out.push({ ...it, x: cx, y, w: rw, h: rh }); cx += rw; } y += rh; h -= rh; }
    row = [];
  };
  for (const it of items) {
    const side = Math.min(w, h);
    if (row.length && worst(row.concat(it), side) > worst(row, side)) layRow();
    row.push(it);
  }
  if (row.length) layRow();
  return out;
}

function frameState(ci, q) {
  const frames = S.chapters[ci].frames;
  const f = q * (frames.length - 1), i = Math.floor(f), j = Math.min(frames.length - 1, i + 1), k = f - i;
  const a = frames[i], b = frames[j];
  const lerp = (x, y) => x + (y - x) * k;
  return { f, i, frame: frames[Math.round(f)], sizes: a.s.map((v, g) => lerp(v, b.s[g])),
           commits: lerp(a.c, b.c), people: lerp(a.a, b.a), lines: lerp(a.l, b.l), time: lerp(a.t, b.t) };
}

// How brightly an area glows: it flares when a commit touches it, then cools down.
function heat(ci, f, g) {
  const active = S.chapters[ci].active;
  let glow = 0;
  for (let k = Math.floor(f); k >= Math.max(1, Math.floor(f) - 6); k--) {
    const weight = active[k].get(g);
    if (weight) glow = Math.max(glow, weight * Math.exp(-(f - k) / 1.7));
  }
  return glow;
}

function drawTreemap(ci, st) {
  ctx.clearRect(0, 0, W, H);
  const total = st.sizes.reduce((a, b) => a + b, 0);
  if (total <= 0 || W < 10 || H < 10) return;
  // The map's area is proportional to the number of lines, so you can watch the project grow.
  const scale = Math.sqrt(clamp(total / S.peak_lines, 0.0008, 1));
  const w = W * scale, h = H * scale, x0 = (W - w) / 2, y0 = (H - h) / 2;
  const items = [];
  st.sizes.forEach((v, g) => { if (v > 0.5) items.push({ g, v: (v / total) * w * h, lines: v }); });
  const boxes = squarify(items, x0, y0, w, h);
  const gap = W < 500 ? 1.5 : 2.5;
  for (const b of boxes) {
    const bw = b.w - gap, bh = b.h - gap;
    if (bw < 0.5 || bh < 0.5) continue;
    const [r, gr, bl] = RGB[b.g], hot = heat(ci, st.f, b.g);
    ctx.save();
    ctx.shadowColor = `rgba(${r},${gr},${bl},${0.9 * hot})`;
    ctx.shadowBlur = 26 * hot;
    ctx.fillStyle = `rgba(${r},${gr},${bl},${0.6 + 0.4 * hot})`;
    ctx.beginPath();
    const radius = Math.min(6, bw / 4, bh / 4);
    if (ctx.roundRect) ctx.roundRect(b.x + gap / 2, b.y + gap / 2, bw, bh, radius); else ctx.rect(b.x + gap / 2, b.y + gap / 2, bw, bh);
    ctx.fill();
    ctx.restore();
    if (hot > 0.05) { ctx.strokeStyle = `rgba(255,255,255,${0.55 * hot})`; ctx.lineWidth = 1; ctx.stroke(); }
    if (bw > 58 && bh > 26) {
      const name = S.areas[b.g].name, size = clamp(Math.min(bw / 9, bh / 3.2), 10, 15);
      ctx.save();
      ctx.beginPath(); ctx.rect(b.x, b.y, bw, bh); ctx.clip();
      ctx.shadowColor = "rgba(0,0,0,.7)"; ctx.shadowBlur = 4;
      ctx.fillStyle = "rgba(255,255,255,.95)";
      ctx.font = `600 ${size}px Inter, system-ui, sans-serif`;
      ctx.fillText(name, b.x + gap / 2 + 8, b.y + gap / 2 + 8 + size);
      if (bh > 26 + size * 1.6) {
        ctx.fillStyle = "rgba(255,255,255,.62)";
        ctx.font = `400 ${Math.max(9.5, size - 3)}px "JetBrains Mono", ui-monospace, monospace`;
        ctx.fillText(short(b.lines) + " lines", b.x + gap / 2 + 8, b.y + gap / 2 + 12 + size * 2.1);
      }
      ctx.restore();
    }
  }
}

// ---------- drawing one moment of the film ----------
let lastLegend = "", lastTicker = -1, lastChapter = -2, lastStats = "";
function draw(t) {
  const seg = segmentAt(t), u = t - seg.start;
  const ci = seg.kind === "intro" ? 0 : seg.kind === "credits" ? S.chapters.length - 1 : seg.i;
  const q = seg.kind === "intro" ? 0 : seg.kind === "credits" ? 1 : growth(seg, u);
  const ch = S.chapters[ci], st = frameState(ci, q);
  drawTreemap(ci, st);

  // header
  setText($("date"), monthYear(st.time));
  const chapterKey = seg.kind === "intro" ? -1 : ci;
  if (chapterKey !== lastChapter) {
    $("label").innerHTML = "";
    if (seg.kind !== "intro") {
      const tag = document.createElement("span"); tag.textContent = "Chapter " + ROMAN[ci];
      $("label").append(tag, document.createTextNode(ch.title));
    }
    setText($("cc-kicker"), "Chapter " + ROMAN[ci]);
    setText($("cc-title"), ch.title);
    setText($("cc-meta"), monthYear(ch.first_time) + "  —  " + monthYear(ch.last_time));
    lastChapter = chapterKey;
  }
  const stats = `<div><b>${full(st.commits)}</b>commits</div><div><b>${full(st.people)}</b>people</div><div><b>${short(st.lines)}</b>lines</div>`;
  if (stats !== lastStats) { lastStats = stats; $("stats").innerHTML = stats; }

  // legend: the languages on screen right now
  const langs = new Map();
  st.sizes.forEach((v, g) => { if (v > 0.5) { const a = S.areas[g]; langs.set(a.language, (langs.get(a.language) || 0) + v); } });
  const legendKey = [...langs.keys()].sort().join("|");
  if (legendKey !== lastLegend) {
    lastLegend = legendKey;
    const color = Object.fromEntries(S.areas.map((a) => [a.language, a.color]));
    $("legend").innerHTML = "";
    [...langs.entries()].sort((a, b) => b[1] - a[1]).slice(0, 9).forEach(([name]) => {
      const item = document.createElement("span"), dot = document.createElement("i");
      dot.style.background = color[name]; item.append(dot, name); $("legend").append(item);
    });
  }

  // ticker: the commit happening right now
  const tickerKey = ci * 1000 + Math.round(st.f);
  if (tickerKey !== lastTicker) {
    lastTicker = tickerKey;
    const fr = st.frame, el = $("ticker");
    el.innerHTML = "";
    if (fr.h) { const who = document.createElement("em"); who.textContent = fr.h + "  " + fr.w; el.append(who, " — " + fr.m); }
  }

  // narration: one sentence at a time, like subtitles
  let caption = "", captionAlpha = 0;
  if (seg.kind === "chapter" && ch.sentences.length) {
    const from = CARD - 0.3, to = seg.dur - 0.5, totalWords = ch.words.reduce((a, b) => a + b, 0);
    let s0 = from;
    for (let k = 0; k < ch.sentences.length; k++) {
      const s1 = s0 + (to - from) * ch.words[k] / totalWords;
      if (u >= s0 && u < s1) { caption = ch.sentences[k]; captionAlpha = fadeInOut(u - s0, s1 - s0, 0.35, 0.35); break; }
      s0 = s1;
    }
  }
  setText($("caption"), caption);
  setOpacity($("caption"), captionAlpha);

  // cards
  setOpacity($("intro"), seg.kind === "intro" ? fadeInOut(u, seg.dur, 0.8, 1.0) : 0);
  setOpacity($("chapter-card"), seg.kind === "chapter" ? clamp(Math.min(u / 0.45, (CARD - u) / 0.6)) : 0);

  let toast = null, toastAlpha = 0;
  if (seg.kind === "chapter") for (const e of ch.events) {
    const te = eventTime(seg, e.at);
    if (u >= te && u < te + TOAST) { toast = e; toastAlpha = fadeInOut(u - te, TOAST, 0.3, 0.5); }
  }
  if (toast) { setText($("toast").firstChild, toast.kind); setText($("toast").lastChild, toast.text); }
  setOpacity($("toast"), toastAlpha);

  const credits = $("credits");
  if (seg.kind === "credits") {
    const rollDur = seg.dur - 4.2, roll = $("roll"), p = clamp(u / rollDur);
    setOpacity(credits, clamp(u / 0.8));
    roll.style.transform = `translateY(${credits.clientHeight - p * (roll.scrollHeight + credits.clientHeight)}px)`;
    setOpacity(roll, u < rollDur ? 1 : 0);
    const endAlpha = clamp((u - rollDur + 0.4) / 0.9);
    setOpacity($("end"), endAlpha);
    credits.style.pointerEvents = endAlpha > 0.5 ? "auto" : "none";
  } else {
    setOpacity(credits, 0);
    credits.style.pointerEvents = "none";
  }

  // timeline
  const pct = (100 * t / TOTAL).toFixed(3) + "%";
  $("fill").style.width = pct; $("head").style.left = pct;
  setText($("time"), clock(t) + " / " + clock(TOTAL));
  $("track").setAttribute("aria-valuenow", Math.round(t));
}

// ---------- playback ----------
let t = 0, playing = true, speed = 1, last = performance.now();
const ICON_PLAY = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg width="16" height="16" viewBox="0 0 16 16"><rect x="3.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/><rect x="9.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/></svg>';
function setPlaying(on) {
  if (on && t >= TOTAL) t = 0;
  playing = on;
  $("play").innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  $("play").setAttribute("aria-label", on ? "Pause" : "Play");
}
function seek(to) { t = clamp(to, 0, TOTAL); draw(t); }
function jump(direction) {
  const seg = segmentAt(t), index = segments.indexOf(seg);
  const target = direction < 0 && t - seg.start > 1.5 ? seg : segments[clamp(index + direction, 0, segments.length - 1)];
  seek(target.start + 0.001);
}
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (playing) { t += dt * speed; if (t >= TOTAL) { t = TOTAL; setPlaying(false); } }
  draw(t);
  requestAnimationFrame(tick);
}

$("play").onclick = () => setPlaying(!playing);
$("replay").onclick = () => { t = 0; setPlaying(true); };
$("speed").onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; setText($("speed"), (speed === 0.5 ? "½" : speed) + "×"); };
$("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
$("stage").onclick = () => setPlaying(!playing);
const track = $("track");
track.setAttribute("aria-valuemin", "0"); track.setAttribute("aria-valuemax", String(Math.round(TOTAL)));
const scrub = (e) => { const r = track.getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * TOTAL); };
track.addEventListener("pointerdown", (e) => { track.setPointerCapture(e.pointerId); scrub(e); });
track.addEventListener("pointermove", (e) => { if (track.hasPointerCapture(e.pointerId)) scrub(e); });
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " || e.key === "k") { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "ArrowRight") jump(1);
  else if (e.key === "ArrowLeft") jump(-1);
  else if (e.key === "h") document.body.classList.toggle("clean");
  else if (e.key === "f") $("fs").click();
});

resize();
// A link ending in #t=42 opens the film paused at that moment, so you can share a scene.
const startAt = /[#&]t=([\d.]+)/.exec(location.hash);
if (startAt) { seek(parseFloat(startAt[1])); setPlaying(false); } else setPlaying(true);
requestAnimationFrame(tick);
</script>
</body>
</html>
